name: Refresh DBLP cache

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-dblp-cache
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Download and validate DBLP data
        run: node scripts/refresh-dblp-cache.mjs

      - name: Commit a changed response
        run: |
          if git diff --quiet -- dblp-cache.json; then
            echo "DBLP data has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dblp-cache.json
          git commit -m "Refresh DBLP cache"
          git push
