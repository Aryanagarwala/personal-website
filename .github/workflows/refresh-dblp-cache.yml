name: Refresh site caches

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: site-maintenance
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install publication renderer
        run: npm ci --ignore-scripts

      - name: Download and validate DBLP data
        continue-on-error: true
        run: node scripts/refresh-dblp-cache.mjs

      - name: Render publications into the homepage
        run: npm run build:publications

      - name: Download and validate music playlists
        continue-on-error: true
        run: node scripts/refresh-heavy-rotation.mjs

      - name: Update sitemap dates for changed page content
        run: npm run build:sitemap -- --include-working-tree

      - name: Commit changed caches
        id: update
        run: |
          if git diff --quiet -- index.html dblp-cache.json heavy-rotation.json your-essentials.json sitemap.xml; then
            echo "Cached data has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dblp-cache.json heavy-rotation.json your-essentials.json sitemap.xml
          git commit -m "Refresh site caches"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish refreshed pages
        if: steps.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
