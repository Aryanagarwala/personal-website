name: Refresh site caches

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-site-caches
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Download and validate DBLP data
        continue-on-error: true
        run: node scripts/refresh-dblp-cache.mjs

      - name: Download and validate Heavy Rotation
        continue-on-error: true
        run: node scripts/refresh-heavy-rotation.mjs

      - name: Commit changed caches
        run: |
          if git diff --quiet -- dblp-cache.json heavy-rotation.json; then
            echo "Cached data has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dblp-cache.json heavy-rotation.json
          git commit -m "Refresh site caches"
          git push
